<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>视频房间</title>
<style>
  :root {
    --bg: #0f1115; --panel: #1a1d24; --text: #e8eaed; --muted: #9aa0a6;
    --accent: #3b82f6; --danger: #ef4444; --border: #2a2e37;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  button, input { font: inherit; }

  #lobby { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px 24px; }
  .card h1 { margin: 0 0 6px; font-size: 22px; }
  .card p { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .card input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 18px; text-align: center; letter-spacing: 2px; }
  .card input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .primary { width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 16px; cursor: pointer; }
  .primary:disabled { opacity: .5; cursor: default; }
  .err { color: var(--danger); font-size: 14px; margin-top: 12px; min-height: 1em; }
  .usage { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center;
    font-size: 13px; line-height: 1.7; color: var(--text); }
  .usage-note { color: var(--muted); font-size: 12px; }
  .usage a { color: var(--accent); text-decoration: none; }
  #callUsage { color: var(--muted); font-size: 12px; }

  #call { position: fixed; inset: 0; display: none; background: #000; }
  #remote { position: absolute; inset: 0; background: #000; }
  #local { position: absolute; right: 16px; top: calc(16px + env(safe-area-inset-top)); width: 28vw; max-width: 200px;
    aspect-ratio: 3/4; border-radius: 12px; border: 2px solid rgba(255,255,255,.25);
    background: #222; overflow: hidden; z-index: 2; }
  #status { z-index: 2; position: absolute; left: 16px; top: calc(16px + env(safe-area-inset-top)); max-width: calc(100% - 32px - 30vw);
    background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.5; }
  #status b { font-variant-numeric: tabular-nums; }
  #waiting { z-index: 1; position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 16px; text-align: center; color: var(--muted); pointer-events: none; }
  #waiting .big { font-size: 18px; color: var(--text); }
  #waiting button { pointer-events: auto; }
  .ghost { padding: 10px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.08); color: #fff; cursor: pointer; }
  #controls { z-index: 3; position: absolute; left: 0; right: 0; bottom: calc(24px + env(safe-area-inset-bottom));
    display: flex; justify-content: center; gap: 18px; }
  .ctl { width: 56px; height: 56px; border-radius: 50%; border: 0; cursor: pointer; font-size: 13px;
    background: rgba(255,255,255,.18); color: #fff; backdrop-filter: blur(6px); }
  .ctl.off { background: #fff; color: #111; }
  .ctl.hang { background: var(--danger); }
  .ctl[hidden] { display: none; }
  .ctl:disabled { opacity: .4; cursor: default; }
  #playBtn { z-index: 4; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none;
    padding: 14px 22px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-size: 16px; cursor: pointer; }
  #remoteOff { z-index: 1; position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: var(--muted); font-size: 16px; background: #111; }
  @media (max-width: 400px) { #controls { gap: 12px; } .ctl { width: 52px; height: 52px; font-size: 12px; } }
</style>
</head>
<body>

<div id="lobby">
  <form class="card" id="joinForm">
    <h1>视频房间</h1>
    <p>两个人输入同一个房间号，就能开始视频通话。</p>
    <input id="roomInput" placeholder="输入房间号" maxlength="32" autocomplete="off" inputmode="text" required>
    <button class="primary" id="joinBtn" type="submit">进入房间</button>
    <div class="err" id="lobbyErr"></div>
    <div class="usage">
      <span id="usageText"></span><br>
      <span class="usage-note">估算，只统计这台设备上的通话</span><br>
      <a href="https://console.shengwang.cn/" target="_blank" rel="noopener">去声网控制台查看真实用量 ›</a>
    </div>
  </form>
</div>

<div id="call">
  <div id="remote"></div>
  <div id="remoteOff">对方关闭了摄像头</div>
  <div id="waiting">
    <div class="big" id="waitText">等待对方加入…</div>
    <div>把房间号告诉对方，或直接发链接</div>
    <button class="ghost" id="copyBtn" type="button">复制邀请链接</button>
  </div>
  <div id="local"></div>
  <button id="playBtn" type="button">点击开启声音</button>
  <div id="status">房间 <b id="roomLabel"></b><br><span id="statusText">连接中…</span><br><span id="callUsage"></span></div>
  <div id="controls">
    <button class="ctl" id="micBtn" type="button">麦克风</button>
    <button class="ctl" id="camBtn" type="button">摄像头</button>
    <button class="ctl" id="flipBtn" type="button" hidden>翻转</button>
    <button class="ctl hang" id="hangBtn" type="button">挂断</button>
  </div>
</div>

<script src="agora-rtc.min.js"></script>
<script>
// 通话走声网（Agora）：国内节点 + 自带中转，5G / 公司网络也能连。
// 同一个房间号 = 同一个频道；一个房间只允许两个人。
const APP_ID = '642aee87dccc48e4ba404737d081a9ce';
// 项目开着 App 证书，进房间要 Token，这里在网页里直接生成（证书因此是公开的，账号主人已知情同意）
const APP_CERT = 'b7434a677a0d430d98804b78c9fd10d2';
const TOKEN_SECONDS = 24 * 3600;

// 声网 Token（AccessToken2 / 007），算法同官方 agora-token 库的 RtcTokenBuilder2
const AgoraToken = (() => {
  const enc = new TextEncoder();
  const u16 = v => [v & 255, (v >>> 8) & 255];
  const u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  const str = s => { const b = typeof s === 'string' ? [...enc.encode(s)] : [...s]; return [...u16(b.length), ...b]; };
  async function hmac(key, msg) {
    const k = await crypto.subtle.importKey('raw', new Uint8Array(key), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    return [...new Uint8Array(await crypto.subtle.sign('HMAC', k, new Uint8Array(msg)))];
  }
  // zlib 格式、不压缩（stored）的 deflate，服务端照常能解
  function zlibStored(data) {
    const out = [0x78, 0x01];
    for (let i = 0; i < data.length || i === 0; i += 65535) {
      const chunk = data.slice(i, i + 65535), last = i + 65535 >= data.length;
      out.push(last ? 1 : 0, ...u16(chunk.length), ...u16(~chunk.length & 0xffff), ...chunk);
      if (last) break;
    }
    let a = 1, b = 0;
    for (const x of data) { a = (a + x) % 65521; b = (b + a) % 65521; }
    const adler = ((b << 16) | a) >>> 0;
    out.push(adler >>> 24, (adler >>> 16) & 255, (adler >>> 8) & 255, adler & 255);
    return out;
  }
  async function buildRtc(appId, cert, channel, uid, expireSeconds) {
    const issueTs = Math.floor(Date.now() / 1000);
    const salt = Math.floor(Math.random() * 99999999) + 1;
    const privileges = [1, 2, 3, 4]; // 进频道、发音频、发视频、发数据流
    const service = [...u16(1), ...u16(privileges.length)];
    for (const p of privileges) service.push(...u16(p), ...u32(expireSeconds));
    service.push(...str(channel), ...str(uid === 0 ? '' : String(uid)));
    const info = [...str(appId), ...u32(issueTs), ...u32(expireSeconds), ...u32(salt), ...u16(1), ...service];
    let signing = await hmac(u32(issueTs), [...enc.encode(cert)]);
    signing = await hmac(u32(salt), signing);
    const signature = await hmac(signing, info);
    const content = [...str(signature), ...info];
    let bin = ''; for (const x of zlibStored(content)) bin += String.fromCharCode(x);
    return '007' + btoa(bin);
  }
  return { buildRtc };
})();

const $ = id => document.getElementById(id);
let client = null, mic = null, cam = null, partner = null;
let room = '', leaving = false, full = false, wakeLock = null, facing = 'user';
let rejoining = false, joinFails = 0, retryTimer = null;
const AUDIO_CFG = { AEC: true, ANS: true };
const VIDEO_CFG = { encoderConfig: '720p_1', optimizationMode: 'motion' };

function setStatus(t) { $('statusText').textContent = t; }
function showWaiting(text) { $('waitText').textContent = text; $('waiting').style.display = 'flex'; }
function hideWaiting() { $('waiting').style.display = 'none'; }

// 链接里带房间号：?room=1234
const urlRoom = new URLSearchParams(location.search).get('room');
if (urlRoom) $('roomInput').value = urlRoom;

if (window.AgoraRTC) {
  AgoraRTC.setLogLevel(3);
  // 手机浏览器不让自动播放声音时，显示一个按钮让用户点一下
  AgoraRTC.onAutoplayFailed = () => { $('playBtn').style.display = 'block'; };
}

// 房间号可能是中文，转成频道名允许的字符（字母数字，64 字节以内）
async function channelName(r) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('jjvc:' + r));
  return 'r' + [...new Uint8Array(buf)].slice(0, 20).map(b => b.toString(16).padStart(2, '0')).join('');
}

function mediaError(err) {
  const code = err && (err.code || err.name);
  if (code === 'PERMISSION_DENIED' || code === 'NotAllowedError') return '摄像头/麦克风权限被拒绝，请在浏览器设置里允许后重试';
  if (code === 'DEVICE_NOT_FOUND' || code === 'NotFoundError') return '没有找到摄像头或麦克风';
  if (code === 'NOT_READABLE' || code === 'NotReadableError') return '摄像头或麦克风被别的应用占用了，请关掉后重试';
  return '无法打开摄像头/麦克风：' + ((err && err.message) || code);
}

async function openMedia() {
  try {
    [mic, cam] = await AgoraRTC.createMicrophoneAndCameraTracks(AUDIO_CFG, { ...VIDEO_CFG, facingMode: 'user' });
  } catch (err) {
    // 没有摄像头或摄像头被占用：退回纯语音
    if (['DEVICE_NOT_FOUND', 'NOT_READABLE', 'NotFoundError', 'NotReadableError'].includes(err && (err.code || err.name))) {
      mic = await AgoraRTC.createMicrophoneAudioTrack(AUDIO_CFG);
      cam = null;
    } else {
      throw err;
    }
  }
}

$('joinForm').addEventListener('submit', async e => {
  e.preventDefault();
  room = $('roomInput').value.trim();
  if (!room) return;
  const err = msg => { $('joinBtn').disabled = false; $('lobbyErr').textContent = msg; };
  $('joinBtn').disabled = true;
  $('lobbyErr').textContent = '';
  if (!window.AgoraRTC) return err('通话组件没有加载出来，请检查网络后刷新页面');
  if (!window.isSecureContext) return err('需要用 https 打开网页才能使用摄像头');
  if (!AgoraRTC.checkSystemRequirements()) return err('这个浏览器不支持视频通话，请换 Chrome / Safari，或在微信里用浏览器打开');
  try {
    await openMedia();
  } catch (e2) {
    return err(mediaError(e2));
  }
  history.replaceState(null, '', '?room=' + encodeURIComponent(room));
  leaving = false; full = false; partner = null; facing = 'user'; joinFails = 0;
  watchTracks();
  $('roomLabel').textContent = room;
  $('lobby').style.display = 'none';
  $('call').style.display = 'block';
  $('camBtn').disabled = !cam;
  $('local').style.display = cam ? '' : 'none';
  if (cam) cam.play('local', { mirror: true, fit: 'cover' });
  updateFlipBtn();
  keepAwake();
  joinChannel();
});

// ---------- 进房间 ----------

async function joinChannel() {
  setStatus('连接中…');
  showWaiting('连接中…');
  client = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
  bindClient(client);
  try {
    const ch = await channelName(room);
    await client.join(APP_ID, ch, await AgoraToken.buildRtc(APP_ID, APP_CERT, ch, 0, TOKEN_SECONDS), null);
  } catch (err) {
    if (leaving) return;
    console.warn(err);
    const msg = String(err && err.message || '');
    if (/static key|invalid vendor key|invalid token|token/i.test(msg)) {
      setStatus('通话服务验证失败（App ID 或证书不对）');
      showWaiting('暂时无法进入房间');
    } else if (++joinFails <= 5) {
      // 网络问题：过几秒自动再试
      setStatus('连不上通话服务器，正在重试…');
      showWaiting('连接中…');
      clearTimeout(retryTimer);
      retryTimer = setTimeout(recover, 3000);
    } else {
      setStatus('连不上通话服务器，请检查网络后重新进入');
      showWaiting('连接失败');
    }
    return;
  }
  joinFails = 0;
  if (leaving) return;
  // 稍等一下，让房间里已有的人都报到
  await new Promise(r => setTimeout(r, 600));
  if (leaving) return;
  if (client.remoteUsers.length >= 2) {
    // 已经有两个人在通话
    const c = client; client = null;
    full = true;
    await c.leave().catch(() => {});
    setStatus('房间已满，请换一个房间号');
    showWaiting('房间已满（已经有两个人在通话）');
    return;
  }
  const tracks = [mic, cam].filter(Boolean);
  try {
    await client.publish(tracks);
  } catch (err) {
    console.warn(err);
    setStatus('发送画面失败，请挂断后重新进入');
    return;
  }
  if (!partner && client.remoteUsers[0]) partner = client.remoteUsers[0].uid;
  if (!partner) {
    setStatus('已进入房间，等待对方');
    showWaiting('等待对方加入…');
  } else {
    setStatus('对方已在房间，正在连接…');
  }
}

function bindClient(c) {
  c.on('user-joined', user => {
    if (c !== client) return;
    if (!partner) {
      partner = user.uid;
      setStatus('对方已进入，正在连接…');
    }
  });
  c.on('user-published', async (user, type) => {
    if (c !== client) return;
    if (!partner) partner = user.uid;
    if (user.uid !== partner) return; // 第三个人（他自己会发现满员退出）
    try { await c.subscribe(user, type); } catch (err) { console.warn(err); return; }
    if (type === 'video') {
      user.videoTrack.play('remote', { fit: 'cover' });
      $('remoteOff').style.display = 'none';
      hideWaiting();
      setStatus('通话中');
    } else {
      user.audioTrack.play();
      if (!user.hasVideo) {
        // 对方是纯语音
        hideWaiting();
        $('remoteOff').textContent = '对方没有打开摄像头';
        $('remoteOff').style.display = 'flex';
        setStatus('通话中');
      }
    }
  });
  c.on('user-unpublished', (user, type) => {
    if (c !== client || user.uid !== partner) return;
    if (type === 'video') {
      $('remoteOff').textContent = '对方关闭了摄像头';
      $('remoteOff').style.display = 'flex';
    }
  });
  c.on('user-info-updated', (uid, msg) => {
    if (c !== client || uid !== partner) return;
    if (msg === 'mute-audio') setStatus('通话中 · 对方已静音');
    if (msg === 'unmute-audio' && $('statusText').textContent.startsWith('通话中')) setStatus('通话中');
    if (msg === 'mute-video') { $('remoteOff').textContent = '对方关闭了摄像头'; $('remoteOff').style.display = 'flex'; }
    if (msg === 'unmute-video') $('remoteOff').style.display = 'none';
  });
  c.on('user-left', user => {
    if (c !== client || user.uid !== partner) return;
    partner = null;
    $('remoteOff').style.display = 'none';
    $('remote').innerHTML = '';
    // 房间里如果还有别人（刚才满员时进来的），接着跟他通话
    const next = c.remoteUsers.find(u => u.uid !== user.uid);
    if (next) {
      partner = next.uid;
      resubscribe(c, next);
    }
    setStatus('已进入房间，等待对方');
    showWaiting('对方已离开，等待重新加入…');
  });
  // Token 快过期时自动续期（通话超过 24 小时才会用到）
  c.on('token-privilege-will-expire', async () => {
    try { c.renewToken(await AgoraToken.buildRtc(APP_ID, APP_CERT, c.channelName, 0, TOKEN_SECONDS)); } catch (_) {}
  });
  c.on('connection-state-change', (cur, prev, reason) => {
    if (c !== client || leaving) return;
    if (cur === 'RECONNECTING') setStatus('网络不稳定，正在重连…');
    if (cur === 'CONNECTED' && prev === 'RECONNECTING') setStatus(partner ? '通话中' : '已进入房间，等待对方');
    if (cur === 'DISCONNECTED' && reason !== 'LEAVE') {
      // 断线（比如切到后台太久）：在前台就马上重连，在后台就等切回来再连
      setStatus('连接断开，正在重新连接…');
      showWaiting('正在重新连接…');
      if (document.visibilityState === 'visible') { clearTimeout(retryTimer); retryTimer = setTimeout(recover, 1000); }
    }
  });
}

// ---------- 切回前台 / 断线后自动恢复 ----------

function inCall() { return !leaving && !full && $('call').style.display === 'block'; }

// 摄像头/麦克风被系统停掉（切后台、来电等）时，切回来自动恢复
function watchTracks() {
  [mic, cam].forEach(t => { if (t) t.on('track-ended', () => { if (document.visibilityState === 'visible') recover(); }); });
}

function trackDead(t) {
  try { return t.getMediaStreamTrack().readyState === 'ended'; } catch (_) { return true; }
}

async function replaceTrack(kind) {
  const old = kind === 'audio' ? mic : cam;
  const fresh = kind === 'audio'
    ? await AgoraRTC.createMicrophoneAudioTrack(AUDIO_CFG)
    : await AgoraRTC.createCameraVideoTrack({ ...VIDEO_CFG, facingMode: facing });
  if (old.muted) await fresh.setMuted(true);
  const c = client;
  if (c && c.localTracks.includes(old)) await c.unpublish(old).catch(() => {});
  old.close();
  if (kind === 'audio') mic = fresh; else cam = fresh;
  fresh.on('track-ended', () => { if (document.visibilityState === 'visible') recover(); });
  if (kind === 'video') fresh.play('local', { mirror: facing !== 'environment', fit: 'cover' });
  if (c && c === client && c.connectionState === 'CONNECTED') await c.publish(fresh).catch(err => console.warn(err));
}

async function rejoin() {
  if (rejoining) return;
  rejoining = true;
  const old = client; client = null; partner = null;
  $('remote').innerHTML = '';
  $('remoteOff').style.display = 'none';
  if (old) await old.leave().catch(() => {});
  try { if (inCall()) await joinChannel(); } finally { rejoining = false; }
}

async function recover() {
  if (!inCall()) return;
  try {
    if (mic && trackDead(mic)) await replaceTrack('audio');
    if (cam && trackDead(cam)) await replaceTrack('video');
  } catch (err) {
    console.warn(err);
    setStatus('摄像头/麦克风没能恢复，请挂断后重新进入');
  }
  if (!inCall() || rejoining) return; // 正在重新进房间时只修摄像头/麦克风
  if (!client || client.connectionState === 'DISCONNECTED' || client.connectionState === 'DISCONNECTING') {
    await rejoin();
    return;
  }
  // 连接还在：把对方的画面和声音重新播一下（iOS 切回来时可能被暂停）
  const u = client.remoteUsers.find(x => x.uid === partner);
  if (u) {
    if (u.videoTrack) { u.videoTrack.stop(); u.videoTrack.play('remote', { fit: 'cover' }); }
    if (u.audioTrack) u.audioTrack.play();
  }
  if (cam && !trackDead(cam)) { cam.stop(); cam.play('local', { mirror: facing !== 'environment', fit: 'cover' }); }
}

async function resubscribe(c, user) {
  for (const type of ['audio', 'video']) {
    if (type === 'video' ? user.hasVideo : user.hasAudio) {
      try {
        await c.subscribe(user, type);
        if (type === 'video') { user.videoTrack.play('remote', { fit: 'cover' }); hideWaiting(); }
        else user.audioTrack.play();
        setStatus('通话中');
      } catch (_) {}
    }
  }
}

// ---------- 按钮 ----------

$('micBtn').onclick = async () => {
  if (!mic) return;
  const off = !mic.muted;
  await mic.setMuted(off);
  $('micBtn').classList.toggle('off', off);
  $('micBtn').textContent = off ? '已静音' : '麦克风';
};

$('camBtn').onclick = async () => {
  if (!cam) return;
  const off = !cam.muted;
  await cam.setMuted(off);
  $('camBtn').classList.toggle('off', off);
  $('camBtn').textContent = off ? '已关闭' : '摄像头';
};

async function updateFlipBtn() {
  let n = 0;
  try { n = (await AgoraRTC.getCameras()).length; } catch (_) {}
  $('flipBtn').hidden = !(cam && n > 1);
}

function camDeviceId() {
  try { return cam.getMediaStreamTrack().getSettings().deviceId; } catch (_) { return ''; }
}

// 前后摄像头切换：手机上按前置/后置切；电脑上有多个摄像头就轮流切
$('flipBtn').onclick = async () => {
  const btn = $('flipBtn');
  if (!cam || btn.disabled) return;
  btn.disabled = true;
  const before = camDeviceId();
  const next = facing === 'user' ? 'environment' : 'user';
  let ok = false;
  try {
    await cam.setDevice({ facingMode: next });
    ok = camDeviceId() !== before;
  } catch (_) {}
  if (!ok) {
    try {
      const cams = await AgoraRTC.getCameras();
      const i = cams.findIndex(d => d.deviceId === before);
      const target = cams[(i + 1) % cams.length];
      if (target && target.deviceId !== before) { await cam.setDevice(target.deviceId); ok = true; }
    } catch (_) {}
  }
  if (ok) {
    facing = next;
    // 后置摄像头不镜像
    cam.stop();
    cam.play('local', { mirror: facing !== 'environment', fit: 'cover' });
  } else {
    setStatus('这台设备无法切换摄像头');
  }
  btn.disabled = false;
};

$('playBtn').onclick = () => {
  $('playBtn').style.display = 'none';
  if (client) client.remoteUsers.forEach(u => { if (u.audioTrack) u.audioTrack.play(); });
};

async function leaveRoom() {
  leaving = true;
  const c = client; client = null; partner = null;
  [mic, cam].forEach(t => { if (t) { t.stop(); t.close(); } });
  mic = cam = null;
  if (c) await c.leave().catch(() => {});
}

$('hangBtn').onclick = () => {
  leaveRoom();
  $('remote').innerHTML = '';
  $('local').innerHTML = '';
  $('remoteOff').style.display = 'none';
  $('playBtn').style.display = 'none';
  $('call').style.display = 'none';
  $('lobby').style.display = 'flex';
  $('joinBtn').disabled = false;
  ['micBtn', 'camBtn'].forEach(id => $(id).classList.remove('off'));
  $('micBtn').textContent = '麦克风'; $('camBtn').textContent = '摄像头';
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
};

$('copyBtn').onclick = async () => {
  const link = location.origin + location.pathname + '?room=' + encodeURIComponent(room);
  try { await navigator.clipboard.writeText(link); $('copyBtn').textContent = '已复制 ✓'; }
  catch (_) { prompt('复制这个链接发给对方：', link); }
  setTimeout(() => $('copyBtn').textContent = '复制邀请链接', 2000);
};

// 通话时不让手机锁屏
async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && inCall()) { keepAwake(); recover(); }
});
window.addEventListener('pageshow', () => { if (inCall()) recover(); });
window.addEventListener('online', () => { if (inCall()) recover(); });

// ---------- 本月用量估算 ----------
// 声网按每个人在房间里的时长分别计费：两人通话 10 分钟算 20 分钟，一个人等着也算。
// 这里只能统计这台设备参与的通话，真实数字以声网控制台为准。
const FREE_MINUTES = 10000;
function usageKey() { const d = new Date(); return 'jjvc-usage-' + d.getFullYear() + '-' + (d.getMonth() + 1); }
function getUsage() { try { return Number(localStorage.getItem(usageKey())) || 0; } catch (_) { return 0; } }
function addUsage(sec) { try { localStorage.setItem(usageKey(), String(getUsage() + sec)); } catch (_) {} }
function renderUsage() {
  const used = Math.ceil(getUsage() / 60);
  const left = Math.max(0, FREE_MINUTES - used);
  $('usageText').textContent = `本月已用约 ${used} 分钟，免费额度剩约 ${left} 分钟`;
  $('callUsage').textContent = `本月已用约 ${used} 分钟 / 剩约 ${left} 分钟`;
}
let lastTick = Date.now();
setInterval(() => {
  const now = Date.now();
  const sec = Math.min(60, (now - lastTick) / 1000); // 手机休眠后回来不会一下记很多
  lastTick = now;
  if (!client || client.connectionState !== 'CONNECTED' || !inCall()) return;
  const partnerHere = partner !== null && client.remoteUsers.some(u => u.uid === partner);
  addUsage(sec * (partnerHere ? 2 : 1));
  renderUsage();
}, 5000);
renderUsage();

// 只在真正关掉网页时离开（切到后台不算）
window.addEventListener('pagehide', e => { if (client && !e.persisted) client.leave(); });
</script>
