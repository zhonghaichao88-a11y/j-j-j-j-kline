services:
  lead-radar:
    build: .
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/lead_radar.db}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-0}
      SEED_DEMO: ${SEED_DEMO:-0}
      APP_BIND_ADDRESS: ${APP_BIND_ADDRESS:-127.0.0.1}
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_USERNAME: ${APP_USERNAME:-admin}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      DOUYIN_API_URL: ${DOUYIN_API_URL:-}
      DOUYIN_API_TOKEN: ${DOUYIN_API_TOKEN:-}
      XHS_API_URL: ${XHS_API_URL:-}
      XHS_API_TOKEN: ${XHS_API_TOKEN:-}
      KUAISHOU_API_URL: ${KUAISHOU_API_URL:-}
      KUAISHOU_API_TOKEN: ${KUAISHOU_API_TOKEN:-}
      WEIBO_API_URL: ${WEIBO_API_URL:-}
      WEIBO_API_TOKEN: ${WEIBO_API_TOKEN:-}
      ZHIHU_API_URL: ${ZHIHU_API_URL:-}
      ZHIHU_API_TOKEN: ${ZHIHU_API_TOKEN:-}
      BILIBILI_API_URL: ${BILIBILI_API_URL:-}
      BILIBILI_API_TOKEN: ${BILIBILI_API_TOKEN:-}
      TIKTOK_API_URL: ${TIKTOK_API_URL:-}
      TIKTOK_API_TOKEN: ${TIKTOK_API_TOKEN:-}
      INSTAGRAM_API_URL: ${INSTAGRAM_API_URL:-}
      INSTAGRAM_API_TOKEN: ${INSTAGRAM_API_TOKEN:-}
      FACEBOOK_API_URL: ${FACEBOOK_API_URL:-}
      FACEBOOK_API_TOKEN: ${FACEBOOK_API_TOKEN:-}
      LINKEDIN_API_URL: ${LINKEDIN_API_URL:-}
      LINKEDIN_API_TOKEN: ${LINKEDIN_API_TOKEN:-}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-}
      TELEGRAM_API_TOKEN: ${TELEGRAM_API_TOKEN:-}
      THREADS_API_URL: ${THREADS_API_URL:-}
      THREADS_API_TOKEN: ${THREADS_API_TOKEN:-}
      PINTEREST_API_URL: ${PINTEREST_API_URL:-}
      PINTEREST_API_TOKEN: ${PINTEREST_API_TOKEN:-}
      QUORA_API_URL: ${QUORA_API_URL:-}
      QUORA_API_TOKEN: ${QUORA_API_TOKEN:-}
      MASTODON_API_URL: ${MASTODON_API_URL:-}
      MASTODON_API_TOKEN: ${MASTODON_API_TOKEN:-}
      BLUESKY_API_URL: ${BLUESKY_API_URL:-}
      BLUESKY_API_TOKEN: ${BLUESKY_API_TOKEN:-}
      HACKERNEWS_API_URL: ${HACKERNEWS_API_URL:-}
      HACKERNEWS_API_TOKEN: ${HACKERNEWS_API_TOKEN:-}
      PRODUCTHUNT_API_URL: ${PRODUCTHUNT_API_URL:-}
      PRODUCTHUNT_API_TOKEN: ${PRODUCTHUNT_API_TOKEN:-}
      GITHUB_SEARCH_API_URL: ${GITHUB_SEARCH_API_URL:-}
      GITHUB_SEARCH_API_TOKEN: ${GITHUB_SEARCH_API_TOKEN:-}
    volumes:
      - lead_radar_data:/app/data
    restart: unless-stopped
volumes:
  lead_radar_data:
